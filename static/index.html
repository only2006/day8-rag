<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>文档问答 · RAG</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100dvh; display: flex; flex-direction: column;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #f5f6f8; color: #1a1a1a;
    }
    header {
      padding: 12px 16px; background: #fff; border-bottom: 1px solid #e6e8eb;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    header .title { font-weight: 600; margin-right: auto; }
    header .title small { font-weight: 400; color: #8a9099; margin-left: 8px; }
    .btn {
      padding: 7px 14px; border: 1px solid #d8dce1; border-radius: 8px;
      background: #fff; font: inherit; font-size: 14px; cursor: pointer;
    }
    .btn:hover { border-color: #2f7cf6; color: #2f7cf6; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    #status { font-size: 13px; color: #8a9099; }
    #status.ok { color: #1a8f4a; }
    #status.err { color: #c0392b; }

    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .row { display: flex; flex-direction: column; max-width: 86%; }
    .row.user { align-self: flex-end; align-items: flex-end; }
    .row.ai { align-self: flex-start; }
    .bubble {
      padding: 10px 14px; border-radius: 14px; line-height: 1.7;
      white-space: pre-wrap; word-break: break-word; font-size: 15px;
    }
    .user .bubble { background: #2f7cf6; color: #fff; border-bottom-right-radius: 4px; }
    .ai .bubble { background: #fff; border: 1px solid #e6e8eb; border-bottom-left-radius: 4px; }
    .ai .bubble:empty::after { content: "…"; color: #9aa0a6; }
    .bubble.error { background: #fff1f0; border-color: #ffccc7; color: #c0392b; }

    .sources { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; width: 100%; }
    .src {
      font-size: 12.5px; color: #555; background: #f0f4fb; border-left: 3px solid #2f7cf6;
      padding: 6px 10px; border-radius: 6px; line-height: 1.5;
    }
    .src b { color: #2f7cf6; }

    form { display: flex; gap: 8px; padding: 12px; background: #fff; border-top: 1px solid #e6e8eb; }
    textarea {
      flex: 1; resize: none; padding: 10px 12px; font: inherit; font-size: 15px;
      border: 1px solid #d8dce1; border-radius: 10px; outline: none; max-height: 120px;
    }
    textarea:focus { border-color: #2f7cf6; }
    #send {
      padding: 0 20px; border: 0; border-radius: 10px; background: #2f7cf6; color: #fff;
      font: inherit; font-weight: 600; cursor: pointer;
    }
    #send:disabled { background: #a9c4f5; cursor: not-allowed; }
    input[type=file] { display: none; }
  </style>
</head>
<body>
  <header>
    <div class="title">文档问答 <small>上传文档，提问，答案带出处</small></div>
    <span id="status">就绪</span>
    <input type="file" id="fileInput" accept=".pdf,.docx,.txt,.md" />
    <button class="btn" id="uploadBtn">上传文档</button>
  </header>

  <main id="messages"></main>

  <form id="form">
    <textarea id="input" rows="1" placeholder="就上传的文档提问…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button id="send" type="submit">提问</button>
  </form>

  <script>
    const API = "";
    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("form");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const statusEl = document.getElementById("status");
    const fileInput = document.getElementById("fileInput");
    const uploadBtn = document.getElementById("uploadBtn");

    function setStatus(text, kind = "") {
      statusEl.textContent = text;
      statusEl.className = kind;
    }

    function addRow(role) {
      const row = document.createElement("div");
      row.className = `row ${role}`;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      row.appendChild(bubble);
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return { row, bubble };
    }

    function renderSources(row, sources) {
      const old = row.querySelector(".sources");
      if (old) old.remove();
      if (!sources || !sources.length) return;

      const box = document.createElement("div");
      box.className = "sources";
      for (const s of sources) {
        const el = document.createElement("div");
        el.className = "src";
        const loc = s.page_no > 0 ? ` · 第${s.page_no}页` : "";
        const sec = s.section ? ` · ${s.section}` : "";
        el.innerHTML = `<b>[${s.id}]</b> ${s.doc_id}${loc}${sec}` +
                       ` <span style="color:#9aa0a6">相似度 ${s.sim}</span>`;
        box.appendChild(el);
      }
      row.appendChild(box);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // 只保留被回答实际引用的出处：答案里出现了 [n] 才算
    function keepCited(sources, answer) {
      const cited = new Set([...answer.matchAll(/\[(\d+)\]/g)].map((m) => Number(m[1])));
      if (!cited.size) return sources;
      const filtered = sources.filter((s) => cited.has(s.id));
      return filtered.length ? filtered : sources;
    }

    // ---------------- 上传 ----------------
    uploadBtn.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];
      if (!file) return;

      uploadBtn.disabled = true;
      setStatus(`上传中：${file.name}`, "");

      const data = new FormData();
      data.append("file", file);

      try {
        const resp = await fetch(`${API}/upload`, { method: "POST", body: data });
        const body = await resp.json();
        if (!resp.ok) throw new Error(body.detail || `HTTP ${resp.status}`);
        setStatus(`已入库：${body.doc_id}（${body.chars} 字，${body.chunks} 块）`, "ok");
      } catch (e) {
        setStatus(`上传失败：${e.message}`, "err");
      } finally {
        uploadBtn.disabled = false;
        fileInput.value = "";
      }
    });

    // ---------------- 提问 ----------------
    async function ask(question) {
      addRow("user").bubble.textContent = question;

      const { row, bubble } = addRow("ai");
      let answer = "";
      let allSources = [];
      let sourcesShown = false;

      sendBtn.disabled = true;
      setStatus("检索中…", "");

      try {
        const resp = await fetch(`${API}/ask`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, k: 4 }),
        });
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          throw new Error(typeof err.detail === "string" ? err.detail : `HTTP ${resp.status}`);
        }

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          const blocks = buffer.split("\n\n");
          buffer = blocks.pop();

          for (const block of blocks) {
            const line = block.split("\n").find((l) => l.startsWith("data: "));
            if (!line) continue;
            let evt;
            try { evt = JSON.parse(line.slice(6)); } catch { continue; }

            if (evt.type === "sources") {
              allSources = evt.sources || [];
              if (!sourcesShown) { renderSources(row, allSources); sourcesShown = true; }
              setStatus("生成中…", "");
            } else if (evt.type === "delta") {
              answer += evt.text;
              bubble.textContent = answer;
              messagesEl.scrollTop = messagesEl.scrollHeight;
            } else if (evt.type === "error") {
              bubble.classList.add("error");
              bubble.textContent = `出错了：${evt.message}`;
            } else if (evt.type === "done") {
              // 生成结束后，只留被引用的出处
              if (allSources.length) renderSources(row, keepCited(allSources, answer));
              setStatus("就绪", "");
            }
          }
        }
      } catch (e) {
        bubble.classList.add("error");
        bubble.textContent = `出错了：${e.message}`;
        setStatus("失败", "err");
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = inputEl.value.trim();
      if (!text || sendBtn.disabled) return;
      inputEl.value = "";
      ask(text);
    });

    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    fetch(`${API}/health`).then(r => r.json())
      .then(d => setStatus(`就绪 · 库内 ${d.chunks} 块`, "ok"))
      .catch(() => setStatus("服务未连接", "err"));

    inputEl.focus();
  </script>
</body>
</html>
